name: PR125 review fix

on:
  push:
    branches:
      - claude/weekly-report-jun29-jul3-gw058t
    paths:
      - .github/workflows/pr125-review-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/weekly-report-jun29-jul3-gw058t
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Apply fixes
        run: python .github/pr125_review_fix.py
      - name: Validate patch shape
        run: |
          python -m pip install 'ruff==0.15.8'
          ruff check src/ugh_quantamental/fx_protocol/automation.py scripts/run_fx_price_alert.py tests/fx_protocol/test_outcome_catchup.py tests/ops/test_run_fx_price_alert.py
          python -m compileall -q src/ugh_quantamental scripts/run_fx_price_alert.py tests/fx_protocol/test_outcome_catchup.py tests/ops/test_run_fx_price_alert.py
          git diff --check
      - name: Commit final tree
        run: |
          rm .github/pr125_review_fix.py .github/workflows/pr125-review-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(fx): address PR125 catch-up and alert review findings"
          git push origin HEAD:claude/weekly-report-jun29-jul3-gw058t
