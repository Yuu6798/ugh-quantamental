name: temp-pr124-round-retraction-scope
on:
  push:
    branches: [claude/weekly-report-jun29-jul3-gw058t]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/weekly-report-jun29-jul3-gw058t
          fetch-depth: 0
      - name: Apply scoped retraction correction
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          report = Path('docs/reports/fx_weekly_report_20260824_20260828.md')
          findings = Path('docs/engine_review_2026_08_findings.md')
          skill = Path('.claude/skills/fx-weekly-report/SKILL.md')

          def replace_once(path: Path, old: str, new: str, label: str) -> None:
              text = path.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 match, got {count}')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace_once(
              report,
              '- **ユーザーへの日次メール通知が届いていない** (少なくとも 2 週間)。',
              '- **ユーザーへの日次メール通知が届いていない** (確認済みの 8/17 以降。それ以前は未確認)。',
              'report outage duration',
          )
          replace_once(
              report,
              '過去 2 週の週報の「安定稼働 (failed 0)」は provider 層のみを見た誤記載であり、\n撤回する。skill にも「運用ヘルスは provider_health と Actions conclusions の 2 層で\n確認する」を追記した。',
              '確認済みの 8/17–8/21 週報の「安定稼働 (failed 0)」は provider 層のみを見た誤記載であり、\n撤回する。8/10–8/14 週報は Actions run 未確認のため、この根拠では撤回しない。\nskill にも「運用ヘルスは provider_health と Actions conclusions の 2 層で確認する」を追記した。',
              'report retraction scope',
          )
          replace_once(
              findings,
              'protocol 本体は正常で provider_health.csv は健全に見えた (週報 2 本が「安定\n稼働」と誤記載 → 訂正済み、skill に 2 層チェックを追記済み)。',
              'protocol 本体は正常で provider_health.csv は健全に見えた (確認済みの 8/17–8/21 週報が「安定\n稼働」と誤記載 → 訂正済み。8/16 以前の Actions run は未確認で、同じ根拠では撤回していない。\nskill に 2 層チェックを追記済み)。',
              'findings retraction scope',
          )
          replace_once(
              skill,
              'The 2026-08 Gmail-535\n   case (every run red at the mail step while data flowed; two weekly reports\n   said 安定稼働 and the user\'s daily emails silently stopped) was one cause',
              'The 2026-08 Gmail-535\n   case (every inspected run from 8/17 onward was red at the mail step while data flowed; the confirmed 8/17–8/21 weekly report\n   said 安定稼働, pre-8/17 Actions runs were not inspected, and the user\'s daily emails silently stopped) was one cause',
              'skill retraction scope',
          )
          PY
      - name: Focused validation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          report = Path('docs/reports/fx_weekly_report_20260824_20260828.md').read_text(encoding='utf-8')
          findings = Path('docs/engine_review_2026_08_findings.md').read_text(encoding='utf-8')
          skill = Path('.claude/skills/fx-weekly-report/SKILL.md').read_text(encoding='utf-8')
          assert '少なくとも 2 週間' not in report
          assert '過去 2 週の週報' not in report
          assert '確認済みの 8/17–8/21 週報' in report
          assert '8/10–8/14 週報は Actions run 未確認' in report
          assert '週報 2 本' not in findings
          assert '確認済みの 8/17–8/21 週報' in findings
          assert '8/16 以前の Actions run は未確認' in findings
          assert 'two weekly reports' not in skill
          assert 'confirmed 8/17–8/21 weekly report' in skill
          assert 'pre-8/17 Actions runs were not inspected' in skill
          PY
          git diff --check
      - name: Commit fix and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/temp_pr124_round_retraction_scope.yml
          git config user.name 'Yuu6798'
          git config user.email 'kkoo6798@gmail.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix(reports): finish scoping Gmail outage retraction'
          git push origin HEAD:claude/weekly-report-jun29-jul3-gw058t
