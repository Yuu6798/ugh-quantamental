name: PR125 regression debug

on:
  push:
    branches:
      - claude/weekly-report-jun29-jul3-gw058t
    paths:
      - .github/workflows/pr125-debug.yml

permissions:
  contents: read

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/weekly-report-jun29-jul3-gw058t
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: |
          python -m pip install -e .
          python -m pip install pytest
      - name: Run isolated regressions with timeouts
        shell: bash
        run: |
          set +e
          for node in \
            'tests/fx_protocol/test_outcome_catchup.py::TestOutcomeCatchupEndToEnd::test_catchup_recovers_gap_window' \
            'tests/fx_protocol/test_outcome_catchup.py::TestOutcomeCatchupEndToEnd::test_failed_catchup_flush_isolated_from_outer_transaction' \
            'tests/fx_protocol/test_outcome_catchup.py::TestOutcomeCatchupEndToEnd::test_rerun_repairs_missing_history_after_db_recovery' \
            'tests/ops/test_run_fx_price_alert.py::TestGitHubIssueStateIO::test_initial_issue_body_restores_state_before_any_comments' \
            'tests/ops/test_run_fx_price_alert.py::TestGitHubIssueStateIO::test_comment_fetch_follows_pagination_and_newest_marker_wins'
          do
            echo "=== $node ==="
            timeout 15s pytest -vv -s "$node"
            code=$?
            echo "EXIT=$code"
          done
          exit 0
