name: PR125 test fix

on:
  push:
    branches:
      - claude/weekly-report-jun29-jul3-gw058t
    paths:
      - .github/workflows/pr125-test-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/weekly-report-jun29-jul3-gw058t
          fetch-depth: 0
      - name: Fix pagination regression test
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('tests/ops/test_run_fx_price_alert.py')
          text = p.read_text(encoding='utf-8')
          old = 'return page1 if "page=1" in url else page2'
          new = 'return page1 if url.endswith("page=1") else page2'
          if old not in text:
              raise SystemExit('test anchor not found')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate corrected test
        run: |
          python -m pip install -e .
          python -m pip install pytest 'ruff==0.15.8'
          ruff check tests/ops/test_run_fx_price_alert.py
          pytest -q tests/ops/test_run_fx_price_alert.py::TestGitHubIssueStateIO::test_comment_fetch_follows_pagination_and_newest_marker_wins
          git diff --check
      - name: Commit final tree
        run: |
          rm .github/workflows/pr125-debug.yml .github/workflows/pr125-test-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "test(fx): fix PR125 pagination regression fixture"
          git push origin HEAD:claude/weekly-report-jun29-jul3-gw058t
