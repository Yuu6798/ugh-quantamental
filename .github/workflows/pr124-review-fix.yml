name: PR124 review fix

on:
  push:
    branches:
      - claude/weekly-report-jun29-jul3-gw058t
    paths:
      - .github/workflows/pr124-review-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/weekly-report-jun29-jul3-gw058t
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Patch forecast-time snapshot preservation
        run: |
          python - <<'PY'
          from pathlib import Path

          automation = Path('src/ugh_quantamental/fx_protocol/automation.py')
          text = automation.read_text(encoding='utf-8')
          if 'import shutil\n' not in text:
              text = text.replace('import os\n', 'import os\nimport shutil\n', 1)
          old = '''        # 7a. input_snapshot.json\n        snap_data = build_input_snapshot(snapshot, obs_now)\n        snap_path = os.path.join(obs_base, f"{date_str_obs}_input_snapshot.json")\n        input_snapshot_path = write_json_artifact(snap_path, snap_data)\n'''
          new = '''        # 7a. input_snapshot.json\n        # Preserve the exact market snapshot used when the forecast batch was created.\n        # Market data is fetched before the idempotency check, so rebuilding this\n        # artifact on a retry would replace the forecast-time spot with the retry spot.\n        snap_path = os.path.join(obs_base, f"{date_str_obs}_input_snapshot.json")\n        history_snap_path = os.path.join(\n            os.path.abspath(config.csv_output_dir),\n            "history",\n            date_str_obs,\n            forecast_batch_id,\n            "input_snapshot.json",\n        )\n        if not forecast_created and os.path.isfile(history_snap_path):\n            os.makedirs(obs_base, exist_ok=True)\n            shutil.copy2(history_snap_path, snap_path)\n            input_snapshot_path = os.path.abspath(snap_path)\n        else:\n            snap_data = build_input_snapshot(snapshot, obs_now)\n            input_snapshot_path = write_json_artifact(snap_path, snap_data)\n'''
          if old not in text:
              raise SystemExit('automation snapshot block not found')
          automation.write_text(text.replace(old, new, 1), encoding='utf-8')

          test = Path('tests/fx_protocol/test_forecast_snapshot_immutability.py')
          test.write_text('''"""Regression test for forecast-time input snapshot preservation."""\n\nfrom __future__ import annotations\n\nimport json\nimport os\nimport tempfile\nfrom unittest.mock import MagicMock, patch\n\nimport pytest\n\nfrom tests.fx_protocol.test_automation_csv_exports import _make_snapshot\nfrom ugh_quantamental.fx_protocol.automation_models import FxDailyAutomationConfig\nfrom ugh_quantamental.fx_protocol.data_sources import FxMarketDataProvider\n\n\ndef _make_session():\n    from ugh_quantamental.persistence.db import (\n        create_all_tables,\n        create_db_engine,\n        create_session_factory,\n    )\n\n    engine = create_db_engine("sqlite+pysqlite:///:memory:")\n    create_all_tables(engine)\n    return create_session_factory(engine)()\n\n\ndef test_idempotent_retry_preserves_forecast_time_input_snapshot() -> None:\n    from ugh_quantamental.fx_protocol.automation import run_fx_daily_protocol_once\n\n    first_snapshot = _make_snapshot()\n    retry_snapshot = first_snapshot.model_copy(update={"current_spot": 151.25})\n    provider = MagicMock(spec=FxMarketDataProvider)\n    provider.fetch_snapshot.side_effect = [first_snapshot, retry_snapshot]\n    session = _make_session()\n\n    with tempfile.TemporaryDirectory() as tmpdir:\n        cfg = FxDailyAutomationConfig(\n            run_outcome_evaluation=False,\n            run_forecast_generation=True,\n            write_csv_exports=True,\n            csv_output_dir=tmpdir,\n        )\n        with patch(\n            "ugh_quantamental.fx_protocol.automation.current_as_of_jst",\n            return_value=first_snapshot.as_of_jst,\n        ), patch(\n            "ugh_quantamental.fx_protocol.automation.is_protocol_business_day",\n            return_value=True,\n        ):\n            first = run_fx_daily_protocol_once(cfg, provider, session)\n            session.commit()\n            retry = run_fx_daily_protocol_once(cfg, provider, session)\n\n        assert first.forecast_created is True\n        assert retry.forecast_created is False\n        assert first.forecast_batch_id == retry.forecast_batch_id\n        assert first.forecast_batch_id is not None\n\n        date_str = first_snapshot.as_of_jst.strftime("%Y%m%d")\n        history_path = os.path.join(\n            tmpdir, "history", date_str, first.forecast_batch_id, "input_snapshot.json"\n        )\n        latest_path = os.path.join(tmpdir, "latest", "input_snapshot.json")\n        with open(history_path, encoding="utf-8") as fh:\n            history_snapshot = json.load(fh)\n        with open(latest_path, encoding="utf-8") as fh:\n            latest_snapshot = json.load(fh)\n\n        assert history_snapshot["current_spot"] == first_snapshot.current_spot\n        assert latest_snapshot["current_spot"] == first_snapshot.current_spot\n        assert history_snapshot["current_spot"] != retry_snapshot.current_spot\n\n    session.close()\n''', encoding='utf-8')

          price = Path('docs/briefs/2026-08_FX-PRICE-ALERT.md')
          ptxt = price.read_text(encoding='utf-8')
          marker = '''      ここを基準にして「前回 snapshot 後の新規 move」だけを測る\n'''
          addition = marker + '''      前提不変条件: 同一 forecast batch の `history/.../input_snapshot.json` は\n      **初回 forecast 生成時の snapshot を保持し、idempotent retry で再生成しない**。\n      automation の回帰 test で forecast 後に spot が変わった retry でも保存 spot が\n      変化しないことを固定する\n'''
          if marker not in ptxt:
              raise SystemExit('price alert marker not found')
          price.write_text(ptxt.replace(marker, addition, 1), encoding='utf-8')

          estar = Path('docs/briefs/2026-08_FX-ESTAR-LAG.md')
          etxt = estar.read_text(encoding='utf-8')
          marker2 = '''      永続化する当日実測の `current_spot` + completed windows) を入力に、\n'''
          addition2 = marker2 + '''      **この history snapshot は forecast batch 作成時点で固定され、後続の\n      idempotent retry では上書きされないことを automation の回帰 test で保証する**。\n'''
          if marker2 not in etxt:
              raise SystemExit('e-star marker not found')
          estar.write_text(etxt.replace(marker2, addition2, 1), encoding='utf-8')
          PY
      - name: Install focused test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest 'ruff==0.15.8'
      - name: Focused validation
        run: |
          ruff check src/ugh_quantamental/fx_protocol/automation.py tests/fx_protocol/test_forecast_snapshot_immutability.py
          pytest -q tests/fx_protocol/test_forecast_snapshot_immutability.py
          git diff --check
          test ! -e .github/workflows/pr124-review-fix.yml || true
      - name: Commit fix and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/ugh_quantamental/fx_protocol/automation.py \
                  tests/fx_protocol/test_forecast_snapshot_immutability.py \
                  docs/briefs/2026-08_FX-PRICE-ALERT.md \
                  docs/briefs/2026-08_FX-ESTAR-LAG.md
          git rm .github/workflows/pr124-review-fix.yml
          git commit -m 'fix(fx): preserve forecast-time input snapshot on retries'
          git push origin HEAD:claude/weekly-report-jun29-jul3-gw058t
