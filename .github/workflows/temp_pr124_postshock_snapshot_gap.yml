name: temp-pr124-postshock-snapshot-gap
on: [push]
permissions:
  contents: write
jobs:
  fix:
    if: github.ref == 'refs/heads/claude/weekly-report-jun29-jul3-gw058t'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/weekly-report-jun29-jul3-gw058t
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply review fixes
        run: python .github/scripts/temp_pr124_fix.py
      - name: Validate focused regression
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e .
          python -m pip install pytest
          python -m compileall -q src/ugh_quantamental/fx_protocol/automation.py tests/fx_protocol/test_forecast_snapshot_immutability.py
          pytest -q tests/fx_protocol/test_forecast_snapshot_immutability.py
          git diff --check
          python -c "from pathlib import Path; b=Path('docs/briefs/2026-08_FX-ESTAR-LAG.md').read_text(encoding='utf-8'); assert '2026-07-30 (ショック日)' in b; assert 'ALWAYS_POSITIVE_POST_SHOCK' in b; assert 'NO_POST_SHOCK_RECOVERY' in b"
      - name: Commit fix and remove temporary files
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/temp_pr124_postshock_snapshot_gap.yml .github/scripts/temp_pr124_fix.py
          git config user.name 'Yuu6798'
          git config user.email 'kkoo6798@gmail.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix(fx): preserve forecast snapshot provenance on retries'
          git push origin HEAD:claude/weekly-report-jun29-jul3-gw058t
