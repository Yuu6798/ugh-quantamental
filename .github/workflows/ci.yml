name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  test:
    if: >-
      (github.event_name == 'pull_request' && github.base_ref == github.event.repository.default_branch)
      || (github.event_name == 'push' && github.ref_name == github.event.repository.default_branch)
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          # ruff is pinned: an unpinned install picks up whatever is latest at
          # run time, so a release that changes default rules turns CI red on
          # untouched code. 0.16.0 did exactly that — it reports 390 findings on
          # main. Adopting the new rules is its own task; this keeps CI
          # reproducible and matching local runs in the meantime.
          python -m pip install pytest 'ruff==0.15.8'

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest -q
